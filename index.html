<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo Pro Max - AI Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; margin: 0; padding: 0; color: #4B4B4B; display: flex; justify-content: center; overflow-x: hidden; }
        
        .app-layout { display: flex; width: 100%; max-width: 1100px; min-height: 100vh; }
        
        /* SIDEBAR */
        .sidebar { width: 250px; border-right: 2px solid #E5E5E5; padding: 20px 15px; display: flex; flex-direction: column; position: fixed; height: 100vh; background: white; z-index: 10; }
        .logo { font-size: 26px; font-weight: 900; color: #58CC02; margin-bottom: 25px; padding-left: 10px; letter-spacing: -1px; }
        .menu-list { display: flex; flex-direction: column; gap: 5px; flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; font-weight: 800; font-size: 13px; color: #777777; text-transform: uppercase; cursor: pointer; transition: 0.1s; border: 2px solid transparent; }
        .menu-item:hover { background: #F7F7F7; }
        .menu-item.active { background: #DDf4C5; color: #58CC02; border: 2px solid #89E219; }
        
        /* CỘT GIỮA */
        .main-content { margin-left: 250px; margin-right: 320px; flex-grow: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .path-banner { width: 100%; max-width: 480px; background: #58CC02; border-radius: 20px; padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 0 #46A302; margin-bottom: 25px; }
        .skill-tree { display: flex; flex-direction: column; align-items: center; gap: 25px; width: 100%; padding-bottom: 50px; }
        .node-row { display: flex; justify-content: center; width: 100%; position: relative; }
        .node-row.offset-1 { transform: translateX(-55px); }
        .node-row.offset-2 { transform: translateX(55px); }
        .node-btn { width: 70px; height: 70px; border-radius: 50%; background: #58CC02; border: none; border-bottom: 6px solid #46A302; font-size: 28px; cursor: pointer; transition: 0.1s; position: relative; display: flex; align-items: center; justify-content: center;}
        .node-btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        .node-btn.chest { background: #FFC800; border-bottom-color: #E5B400; }

        /* CỘT PHẢI */
        .right-sidebar { width: 320px; position: fixed; right: 0; top: 0; height: 100vh; border-left: 2px solid #E5E5E5; padding: 20px; background: white; display: flex; flex-direction: column; gap: 20px; }
        .top-stats { display: flex; justify-content: space-between; font-weight: 900; font-size: 14px; }
        .widget-card { border: 2px solid #E5E5E5; border-radius: 20px; padding: 16px; }

        /* MÀN HÌNH BÀI HỌC */
        .lesson-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: white; z-index: 100; display: flex; flex-direction: column; padding: 20px; }
        .lesson-header { display: flex; align-items: center; gap: 20px; max-width: 700px; margin: 0 auto; width: 100%; margin-bottom: 30px; }
        .lesson-progress { flex-grow: 1; height: 16px; background: #E5E5E5; border-radius: 8px; overflow: hidden; }
        .lesson-progress-fill { width: 0%; height: 100%; background: #58CC02; transition: 0.3s; border-radius: 8px; }
        .lesson-body { max-width: 700px; margin: 0 auto; width: 100%; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px;}
        
        .question-title { font-size: 24px; font-weight: 900; color: #3C3C3C; }
        .btn-audio { background: #1CB0F6; color: white; border: none; border-bottom: 4px solid #1899D6; width: 60px; height: 60px; border-radius: 16px; font-size: 24px; cursor: pointer; }
        .btn-audio:active { transform: translateY(2px); border-bottom-width: 2px; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .opt-btn { background: white; border: 2px solid #E5E5E5; border-bottom: 4px solid #E5E5E5; padding: 15px; border-radius: 16px; font-weight: 800; font-size: 18px; cursor: pointer; color: #3C3C3C; transition: 0.1s;}
        
        .lesson-footer { position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px; background: white; border-top: 2px solid #E5E5E5; display: flex; justify-content: center; }
        .footer-content { max-width: 700px; width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .btn-next { background: #58CC02; color: white; border: none; padding: 15px 40px; border-radius: 16px; font-weight: 900; font-size: 16px; border-bottom: 4px solid #46A302; cursor: pointer; }
        .btn-ai-explain { background: #9400D3; color: white; border: none; padding: 15px 20px; border-radius: 16px; font-weight: 900; font-size: 14px; border-bottom: 4px solid #6A0DAD; cursor: pointer; display: flex; align-items: center; gap: 8px;}

        .hidden { display: none !important; }
        button { font-family: 'Nunito', sans-serif; }
    </style>
</head>
<body>

<div class="app-layout">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div>
            <div class="logo">duolingo</div>
            <div class="menu-list">
                <a class="menu-item active"><span>🏠</span> Học lộ trình</a>
                <a class="menu-item"><span>📖</span> Truyện (Stories)</a>
                <a class="menu-item"><span>🎧</span> DuoRadio</a>
                <a class="menu-item"><span>🤖</span> AI Roleplay</a>
                <a class="menu-item"><span>🛡️</span> Xếp hạng</a>
                <a class="menu-item"><span>🎁</span> Nhiệm vụ</a>
                <a class="menu-item"><span>👤</span> Hồ sơ</a>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="path-banner">
            <div>
                <h4 id="banner-section-title">Học cơ bản đến nâng cao</h4>
                <h2 id="banner-unit-title">Đang tải...</h2>
            </div>
        </div>

        <div class="skill-tree" id="skill-tree-nodes">
            <!-- Node lộ trình -->
        </div>
    </div>

    <!-- RIGHT SIDEBAR -->
    <div class="right-sidebar">
        <div class="top-stats">
            <div style="color: #FF4B4B;"><span style="font-size: 18px;">♾️</span></div>
            <div style="color: #FF9600;">🔥 <span id="stat-streak">1</span></div>
            <div style="color: #1CB0F6;">💎 <span id="stat-gems">500</span></div>
        </div>

        <div class="widget-card">
            <h3>Giải đấu (Leagues)</h3>
            <p style="font-size:13px; color:#777; font-weight:700;">Bạn đang ở Giải Đồng. Cố gắng lọt top 10!</p>
        </div>
    </div>
</div>

<!-- MÀN HÌNH BÀI HỌC -->
<div id="lesson-modal" class="lesson-modal hidden">
    <div class="lesson-header">
        <button onclick="closeLesson()" style="background:none; border:none; font-size:24px; cursor:pointer; font-weight:900; color:#ccc;">✕</button>
        <div class="lesson-progress"><div id="lesson-bar" class="lesson-progress-fill" style="width: 0%;"></div></div>
        <div style="color: #FF4B4B; font-weight:900; font-size:20px;">♾️</div>
    </div>
    
    <div class="lesson-body">
        <div id="question-type-text" class="question-title">Chọn nghĩa đúng của từ này:</div>
        
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
            <button class="btn-audio" onclick="playAudio()"><span style="font-size:20px">🔊</span></button>
            <div id="lesson-target-word" style="font-size: 32px; font-weight: 900; color: #1CB0F6;">Word</div>
        </div>

        <div id="lesson-options" class="options-grid"></div>
    </div>

    <div id="lesson-footer" class="lesson-footer hidden">
        <div class="footer-content">
            <button id="btn-ai-explain" class="btn-ai-explain hidden" onclick="explainWithAI()">✨ Giải thích bằng AI</button>
            <div style="flex-grow:1"></div>
            <button id="lesson-next-btn" class="btn-next" onclick="nextQuestion()">TIẾP TỤC</button>
        </div>
    </div>
</div>

<!-- Modal Giải thích AI -->
<div id="ai-modal" class="hidden" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:30px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.3); z-index:200; max-width:500px; width:90%; border: 4px solid #9400D3;">
    <h2 style="color:#9400D3; margin-top:0;">✨ AI Giải thích</h2>
    <p id="ai-text" style="font-weight:700; line-height:1.6; color:#4B4B4B;">Đang phân tích...</p>
    <button onclick="document.getElementById('ai-modal').classList.add('hidden')" style="background:#E5E5E5; border:none; padding:10px 20px; border-radius:10px; font-weight:bold; cursor:pointer; width:100%;">Đóng</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDIIFo2JMolCY5Ygxdy992z2kyBgXF2L0M",
        authDomain: "applearningenglish-4c758.firebaseapp.com",
        projectId: "applearningenglish-4c758"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let topicsData = [];

    // Tự tải dữ liệu ngay khi vào web
    async function loadData() {
        const querySnapshot = await getDocs(collection(db, "topics"));
        querySnapshot.forEach(doc => topicsData.push(doc.data()));
        topicsData.sort((a, b) => a.id - b.id);
        if(topicsData.length > 0) document.getElementById("banner-unit-title").innerText = topicsData[0].title;
        renderSkillTree();
    }
    loadData();

    function renderSkillTree() {
        const treeContainer = document.getElementById("skill-tree-nodes");
        topicsData.forEach((topic, index) => {
            let rowClass = index % 4 === 1 ? "offset-1" : (index % 4 === 2 || index % 4 === 3 ? "offset-2" : "");
            let rowDiv = document.createElement("div"); rowDiv.className = `node-row ${rowClass}`;
            let btn = document.createElement("button");
            btn.className = "node-btn"; btn.innerHTML = topic.icon;
            btn.onclick = () => startLesson(topic);
            rowDiv.appendChild(btn); treeContainer.appendChild(rowDiv);
        });
    }

    // --- LOGIC BÀI HỌC (HỌC KHÔNG GIỚI HẠN) ---
    let currentQuestions = [];
    let questionIdx = 0;
    let currentWord = "";

    window.startLesson = function(topic) {
        questionIdx = 0;
        currentQuestions = topic.words.map(w => {
            let wrongOptions = topic.words.filter(item => item.vi !== w.vi).map(item => item.vi);
            wrongOptions.sort(() => Math.random() - 0.5);
            let options = [w.vi, wrongOptions[0], wrongOptions[1], wrongOptions[2]].filter(Boolean);
            return { en: w.en, vi: w.vi, options: options.sort(() => Math.random() - 0.5) };
        }).sort(() => Math.random() - 0.5);
        document.getElementById("lesson-modal").classList.remove("hidden");
        loadQuestion();
    };

    window.closeLesson = () => document.getElementById("lesson-modal").classList.add("hidden");

    function loadQuestion() {
        if(questionIdx >= currentQuestions.length) {
            alert("🎉 Hoàn thành xuất sắc! +15 XP");
            return closeLesson();
        }
        let q = currentQuestions[questionIdx];
        currentWord = q.en;
        document.getElementById("lesson-target-word").innerText = q.en;
        document.getElementById("lesson-bar").style.width = `${(questionIdx / currentQuestions.length) * 100}%`;
        
        document.getElementById("lesson-footer").classList.add("hidden");
        document.getElementById("btn-ai-explain").classList.add("hidden");
        
        // Tự động phát âm thanh khi chuyển câu
        playAudio();

        let optContainer = document.getElementById("lesson-options");
        optContainer.innerHTML = "";
        
        q.options.forEach(opt => {
            let btn = document.createElement("button");
            btn.className = "opt-btn"; btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q.vi);
            optContainer.appendChild(btn);
        });
    }

    function checkAnswer(btn, selected, correct) {
        document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
        document.getElementById("lesson-footer").classList.remove("hidden");
        let footer = document.getElementById("lesson-footer");
        let nextBtn = document.getElementById("lesson-next-btn");

        if(selected === correct) {
            btn.style.background = "#DDf4C5"; btn.style.borderColor = "#58CC02"; btn.style.color = "#58CC02";
            footer.style.background = "#DDf4C5";
            nextBtn.style.background = "#58CC02"; nextBtn.style.borderBottomColor = "#46A302";
        } else {
            // Chọn sai -> Hiện màu đỏ & Hiện nút AI (Không bị trừ tim hay kết thúc game)
            btn.style.background = "#FFDFE0"; btn.style.borderColor = "#FF4B4B"; btn.style.color = "#FF4B4B";
            footer.style.background = "#FFDFE0";
            nextBtn.style.background = "#FF4B4B"; nextBtn.style.borderBottomColor = "#EA2B2B";
            
            document.getElementById("btn-ai-explain").classList.remove("hidden"); // Hiện nút AI
        }
    }

    window.nextQuestion = function() {
        questionIdx++;
        document.getElementById("lesson-footer").style.background = "white";
        loadQuestion();
    };

    // --- TÍNH NĂNG ĐỌC GIỌNG NÓI (TEXT TO SPEECH) ---
    window.playAudio = function() {
        let speech = new SpeechSynthesisUtterance(currentWord);
        speech.lang = "en-US";
        speech.rate = 0.9;
        window.speechSynthesis.speak(speech);
    };

    // --- TÍNH NĂNG AI GIẢI THÍCH ---
    window.explainWithAI = function() {
        document.getElementById("ai-modal").classList.remove("hidden");
        let aiText = document.getElementById("ai-text");
        aiText.innerText = `Đang kết nối Gemini API để phân tích từ "${currentWord}"...`;
        
        setTimeout(() => {
            aiText.innerHTML = `💡 <b>${currentWord}</b> có nghĩa là <b>${currentQuestions[questionIdx].vi}</b>.<br><br>
            <i>Ví dụ:</i> "I love my ${currentWord.toLowerCase()}!"<br>
            <i>Mẹo nhớ:</i> (AI sẽ sinh ra mẹo nhớ tự động dựa trên prompt của bạn ở bản sau).`;
        }, 1500);
    };
</script>

</body>
</html>
